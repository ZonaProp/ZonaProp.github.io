<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin · ZonaProp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f0f2f5;color:#222}header{background:#1a1a2e;color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none}.wrap{max-width:780px;margin:0 auto;padding:1rem}.login{background:#fff;padding:1.5rem;border-radius:16px;max-width:380px;margin:3rem auto}.login input{width:100%;padding:.75rem;border:1.5px solid #ddd;border-radius:10px;margin:.4rem 0 1rem}.login button{width:100%;padding:.9rem;border:0;border-radius:12px;background:#ff5500;color:#fff;font-weight:800;cursor:pointer}.err{color:#c62828;display:none}
</style>
</head>
<body>
<header><strong>● Admin ZonaProp</strong><a href="/">Ver sitio</a></header>
<div class="wrap">
  <div class="login" id="loginBox">
    <h2>Acceso admin</h2>
    <p>Ingresá la clave.</p>
    <input id="pass" type="password" placeholder="Clave admin"/>
    <button type="button" id="btnLogin">Entrar</button>
    <div class="err" id="loginErr">Clave incorrecta</div>
  </div>
  <div id="panel" style="display:none">
    <p>Admin conectado. Usá el panel completo en la versión premium si necesitás leads y chats.</p>
    <p><a href="https://zonaprop.github.io/premium/admin.html">Abrir admin completo (premium)</a></p>
  </div>
</div>
<script>
const ADMIN_PASS = 'zonaprop2026';
if (sessionStorage.getItem('zp_admin') === '1') { document.getElementById('loginBox').style.display='none'; document.getElementById('panel').style.display='block'; }
document.getElementById('btnLogin').onclick = function(){
  if (document.getElementById('pass').value === ADMIN_PASS) {
    sessionStorage.setItem('zp_admin', '1');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('panel').style.display='block';
  } else document.getElementById('loginErr').style.display = 'block';
};
</script>
</body>
</html>
